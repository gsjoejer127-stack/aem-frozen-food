<!DOCTYPE html>
<html lang="zh">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  /* Layout: sticky tab bar over one narrow column of cards, built for a phone in the cold room */
  :root { --bg:#f3f5f8; --card:#fff; --ink:#1d2330; --muted:#64708a; --line:#e2e6ee; --soft:#eaf1fa;
          --brand:#0b5cad; --on-brand:#fff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
          --low-bg:#dbeafe; --warn-bg:#fef3c7; --bad-bg:#fee2e2; --shadow:var(--shadow); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#0f141c; --card:#171e29; --ink:#e6ebf3; --muted:#93a0b5; --line:#2a3443; --soft:#1d2b3e;
          --brand:#4b9be8; --on-brand:#08111c; --ok:#3fb86b; --warn:#e5a54b; --bad:#f07070;
          --low-bg:#17304d; --warn-bg:#3a2c12; --bad-bg:#401b1b; --shadow:rgba(0,0,0,.4); color-scheme:dark; } }
  :root[data-theme="dark"] {
          --bg:#0f141c; --card:#171e29; --ink:#e6ebf3; --muted:#93a0b5; --line:#2a3443; --soft:#1d2b3e;
          --brand:#4b9be8; --on-brand:#08111c; --ok:#3fb86b; --warn:#e5a54b; --bad:#f07070;
          --low-bg:#17304d; --warn-bg:#3a2c12; --bad-bg:#401b1b; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:var(--on-brand); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  header small { opacity:.8; }
  nav { display:flex; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; overflow-x:auto; }
  nav button { flex:1; min-width:64px; border:0; background:none; padding:12px 6px; font-size:14px; color:var(--muted);
               border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
  nav button.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  td.num b, .stat b { font-variant-numeric:tabular-nums; }
  section { display:none; } section.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .stat b { display:block; font-size:24px; }
  .stat.warn b { color:var(--warn); } .stat.bad b { color:var(--bad); } .stat.low b { color:var(--brand); }
  .stat.on { outline:2px solid var(--brand); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; padding:10px; background:var(--card); font:inherit; cursor:pointer; }
  .seg button.on { background:var(--brand); color:var(--on-brand); }
  .seg button:disabled { color:var(--line); cursor:not-allowed; }
  .btn { width:100%; margin-top:16px; padding:13px; border:0; border-radius:8px; background:var(--brand); color:var(--on-brand); font:inherit; font-weight:600; cursor:pointer; }
  .btn.out { background:var(--ok); } .btn:disabled { opacity:.5; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:500; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; margin:2px 2px 0 0; }
  .tag.low { background:var(--low-bg); color:var(--brand); } .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.bad { background:var(--bad-bg); color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  .picker { position:relative; }
  .picker ul { position:absolute; left:0; right:0; top:100%; z-index:10; list-style:none; margin:2px 0 0; padding:0; background:var(--card);
               border:1px solid var(--line); border-radius:8px; max-height:280px; overflow:auto; box-shadow:0 6px 20px var(--shadow); }
  .picker li { padding:9px 10px; cursor:pointer; border-bottom:1px solid var(--line); }
  .picker li:hover, .picker li.hi { background:var(--soft); }
  .chosen { margin-top:6px; padding:8px 10px; background:var(--soft); border-radius:8px; font-size:14px; display:none; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); max-width:92%; padding:12px 16px; border-radius:8px;
           color:var(--on-brand); background:var(--ink); color:var(--bg); display:none; z-index:20; white-space:pre-line; }
  .toast.ok { background:var(--ok); color:var(--on-brand); } .toast.err { background:var(--bad); color:var(--on-brand); }
  .loading { text-align:center; padding:30px; color:var(--muted); }
  @media (max-width:560px) { .hide-sm { display:none; } .stat b { font-size:20px; } }
</style>
</head>
<body>
<header>
  <h1>AEM 库存 Inventory</h1>
  <small id="who"></small>
</header>
<nav>
  <button data-tab="dash" class="on">总览</button>
  <button data-tab="in">入库</button>
  <button data-tab="out">出库</button>
  <button data-tab="count">盘点</button>
  <button data-tab="expiry">到期</button>
  <button data-tab="log">记录</button>
</nav>
<main>
  <!-- Dashboard -->
  <section id="dash" class="on">
    <div class="stats">
      <button class="stat low" data-filter="low"><span class="muted">低库存 Low</span><b id="nLow">-</b></button>
      <button class="stat warn" data-filter="expiring"><span class="muted">即将到期 Expiring</span><b id="nExp">-</b></button>
      <button class="stat bad" data-filter="expired"><span class="muted">已过期 Expired</span><b id="nBad">-</b></button>
    </div>
    <div class="card">
      <input id="dashSearch" placeholder="搜索产品 / SKU / 条码  Search">
      <div id="dashTable" class="loading">加载中 Loading…</div>
    </div>
  </section>

  <!-- Stock in -->
  <section id="in">
    <div class="card">
      <label>产品 Product（可扫条码 scan barcode）</label>
      <div class="picker" id="inPicker"></div>
      <label>数量 Quantity</label>
      <div class="row">
        <input id="inQty" type="number" min="1" step="1" inputmode="numeric">
        <div class="seg" id="inUnit"></div>
      </div>
      <div class="row">
        <div><label>有效期 Expiry *</label><input id="inExpiry" type="date"></div>
        <div><label>批号 Lot no</label><input id="inLot"></div>
      </div>
      <div class="row">
        <div><label>仓位 Location</label><select id="inLoc"></select></div>
        <div><label>供应商 Supplier</label><input id="inSupplier"></div>
      </div>
      <label>单据号 Ref (PO / DO)</label><input id="inRef">
      <label>备注 Note</label><input id="inNote">
      <button class="btn" id="inBtn">确认入库 Stock in</button>
    </div>
  </section>

  <!-- Stock out -->
  <section id="out">
    <div class="card">
      <label>产品 Product（可扫条码 scan barcode）</label>
      <div class="picker" id="outPicker"></div>
      <div class="muted" id="outAvail"></div>
      <label>数量 Quantity</label>
      <div class="row">
        <input id="outQty" type="number" min="1" step="1" inputmode="numeric">
        <div class="seg" id="outUnit"></div>
      </div>
      <label>客户 / 单据号 Customer / Invoice / DO</label><input id="outRef">
      <label>备注 Note</label><input id="outNote">
      <button class="btn out" id="outBtn">确认出库 Stock out</button>
      <p class="muted">系统自动按“先到期先出 FEFO”分配批次，过期批次不会被出库。</p>
    </div>
    <div class="card" id="outResult" style="display:none"></div>
  </section>

  <!-- Stocktake -->
  <section id="count">
    <div class="card">
      <label>产品 Product</label>
      <div class="picker" id="countPicker"></div>
      <div id="countBatches" class="muted" style="margin-top:12px">选择产品后显示各批次 Pick a product to see its batches</div>
    </div>
  </section>

  <!-- Expiry -->
  <section id="expiry">
    <div class="card">
      <div id="expiryTable" class="loading">加载中 Loading…</div>
    </div>
  </section>

  <!-- History -->
  <section id="log">
    <div class="card">
      <label>筛选产品 Filter by product（留空 = 全部）</label>
      <div class="picker" id="logPicker"></div>
      <div id="logTable" class="loading" style="margin-top:12px">加载中 Loading…</div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
var state = { summary: [], bySku: {}, filter: '', today: '', warnDays: 30, locations: [] };
var pickers = {};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(e && e.message ? e : new Error(String(e)));
    });
    r[fn].apply(r, args);
  });
}

var toastTimer;
function toast(msg, kind) {
  var t = $('toast');
  t.textContent = msg; t.className = 'toast ' + (kind || ''); t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, kind === 'err' ? 7000 : 3500);
}

// ---------- Tabs ----------
document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('section').forEach(function (s) { s.classList.toggle('on', s.id === b.dataset.tab); });
    if (b.dataset.tab === 'expiry') loadExpiry();
    if (b.dataset.tab === 'log') loadLog();
  };
});

// ---------- Product picker (type name / SKU, or scan barcode + Enter) ----------
function makePicker(id, onPick, allowClear) {
  var root = $(id);
  root.innerHTML = '<input placeholder="输入名称 / SKU / 扫条码" autocomplete="off"><ul style="display:none"></ul><div class="chosen"></div>';
  var input = root.querySelector('input'), list = root.querySelector('ul'), chosen = root.querySelector('.chosen');
  var matches = [], hi = 0, picker = { value: null };

  function match(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    return state.summary.filter(function (p) {
      return [p.name, p.nameZh, p.sku, p.barcode, p.category].join(' ').toLowerCase().indexOf(q) >= 0;
    }).slice(0, 30);
  }
  function render() {
    list.innerHTML = matches.map(function (p, i) {
      return '<li data-i="' + i + '" class="' + (i === hi ? 'hi' : '') + '"><b>' + esc(p.nameZh) + '</b> ' + esc(p.name) +
        '<div class="muted">' + esc(p.packSize) + ' · 库存 ' + esc(p.usableText) + '</div></li>';
    }).join('');
    list.style.display = matches.length ? 'block' : 'none';
  }
  function pick(p) {
    picker.value = p; input.value = ''; matches = []; render();
    chosen.style.display = p ? 'block' : 'none';
    chosen.innerHTML = p ? '<b>' + esc(p.nameZh) + '</b> ' + esc(p.name) + ' <span class="muted">(' + esc(p.packSize) + ')</span>' +
      (allowClear ? ' <a href="#" class="clr">✕</a>' : '') : '';
    var clr = chosen.querySelector('.clr');
    if (clr) clr.onclick = function (e) { e.preventDefault(); pick(null); };
    onPick(p);
  }
  input.oninput = function () { matches = match(input.value); hi = 0; render(); };
  input.onkeydown = function (e) {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, matches.length - 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      var code = input.value.trim();
      var exact = state.summary.filter(function (p) { return p.barcode === code || p.sku === code; });
      if (exact.length === 1) pick(exact[0]);
      else if (matches[hi]) pick(matches[hi]);
    }
  };
  list.onmousedown = function (e) {
    var li = e.target.closest('li'); if (li) { e.preventDefault(); pick(matches[+li.dataset.i]); }
  };
  input.onblur = function () { setTimeout(function () { list.style.display = 'none'; }, 150); };
  picker.pick = pick;
  picker.refresh = function () { if (picker.value) picker.value = state.bySku[picker.value.sku] || null; };
  pickers[id] = picker;
  return picker;
}

function makeUnitToggle(id) {
  var root = $(id), unit = 'base';
  root.innerHTML = '<button type="button" data-u="base" class="on">包 Unit</button><button type="button" data-u="ctn">箱 Ctn</button>';
  var btns = root.querySelectorAll('button');
  btns.forEach(function (b) { b.onclick = function () { set(b.dataset.u); }; });
  function set(u) { unit = u; btns.forEach(function (b) { b.classList.toggle('on', b.dataset.u === u); }); }
  return {
    get: function () { return unit; },
    setProduct: function (p) {
      var canCtn = !!(p && p.unitsPerCarton);
      btns[1].disabled = !canCtn;
      btns[1].textContent = canCtn ? '箱 Ctn (' + p.unitsPerCarton + ')' : '箱 Ctn';
      btns[0].textContent = (p ? p.unit : '包') + ' 单位';
      if (!canCtn) set('base');
    }
  };
}

// ---------- Dashboard ----------
function renderDash() {
  var s = state.summary;
  $('nLow').textContent = s.filter(function (p) { return p.low; }).length;
  $('nExp').textContent = s.filter(function (p) { return p.expiring > 0; }).length;
  $('nBad').textContent = s.filter(function (p) { return p.expired > 0; }).length;
  document.querySelectorAll('.stat').forEach(function (b) { b.classList.toggle('on', b.dataset.filter === state.filter); });

  var q = $('dashSearch').value.trim().toLowerCase();
  var rows = s.filter(function (p) {
    if (state.filter === 'low' && !p.low) return false;
    if (state.filter === 'expiring' && !p.expiring) return false;
    if (state.filter === 'expired' && !p.expired) return false;
    return !q || [p.name, p.nameZh, p.sku, p.barcode, p.category].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) {
    var ra = (a.expired ? 4 : 0) + (a.low ? 2 : 0) + (a.expiring ? 1 : 0);
    var rb = (b.expired ? 4 : 0) + (b.low ? 2 : 0) + (b.expiring ? 1 : 0);
    return rb - ra || (b.usable > 0) - (a.usable > 0) || a.category.localeCompare(b.category) || a.nameZh.localeCompare(b.nameZh);
  });

  $('dashTable').className = '';
  $('dashTable').innerHTML = rows.length ? '<table><tr><th>产品 Product</th><th class="hide-sm">类别</th>' +
    '<th class="num">可用库存</th><th class="num hide-sm">最近到期</th></tr>' +
    rows.map(function (p) {
      var tags = (p.low ? '<span class="tag low">低库存 ≤' + p.reorderLevel + '</span>' : '') +
        (p.expiring ? '<span class="tag warn">' + p.expiring + ' 即将到期</span>' : '') +
        (p.expired ? '<span class="tag bad">' + p.expired + ' 已过期</span>' : '');
      return '<tr><td><b>' + esc(p.nameZh) + '</b> <span class="muted">' + esc(p.name) + '</span><div class="muted">' +
        esc(p.packSize) + '</div>' + tags + '</td><td class="hide-sm muted">' + esc(p.category) + '</td>' +
        '<td class="num"><b>' + esc(p.usableText) + '</b><div class="muted">' + p.usable + ' ' + esc(p.unit) + '</div></td>' +
        '<td class="num hide-sm">' + esc(p.nearestExpiry || '-') + '</td></tr>';
    }).join('') + '</table>' : '<p class="muted">没有符合的产品 No matching products</p>';
}
$('dashSearch').oninput = renderDash;
document.querySelectorAll('.stat').forEach(function (b) {
  b.onclick = function () { state.filter = state.filter === b.dataset.filter ? '' : b.dataset.filter; renderDash(); };
});

// ---------- Stock in ----------
var inUnit = makeUnitToggle('inUnit');
var inPicker = makePicker('inPicker', function (p) { inUnit.setProduct(p); if (p) $('inQty').focus(); });
$('inBtn').onclick = function () {
  var p = inPicker.value;
  if (!p) return toast('请选择产品 Pick a product', 'err');
  if (!$('inExpiry').value) return toast('冷冻食品请填写有效期 Expiry date is required', 'err');
  var btn = this; btn.disabled = true;
  call('apiStockIn', { sku: p.sku, qty: $('inQty').value, unit: inUnit.get(), expiry: $('inExpiry').value,
    lotNo: $('inLot').value, location: $('inLoc').value, supplier: $('inSupplier').value,
    ref: $('inRef').value, note: $('inNote').value })
    .then(function (r) {
      toast('✓ 已入库 ' + p.nameZh + ' ' + r.text + '\n批次 ' + r.batchId, 'ok');
      ['inQty', 'inLot', 'inNote'].forEach(function (id) { $(id).value = ''; });
      inPicker.pick(null);
      return refresh();
    })
    .catch(function (e) { toast(e.message, 'err'); })
    .then(function () { btn.disabled = false; });
};

// ---------- Stock out ----------
var outUnit = makeUnitToggle('outUnit');
var outPicker = makePicker('outPicker', function (p) {
  outUnit.setProduct(p);
  $('outAvail').innerHTML = p ? '可用库存 Available: <b>' + esc(p.usableText) + '</b> (' + p.usable + ' ' + esc(p.unit) + ')' +
    (p.expired ? ' · <span style="color:var(--bad)">另有 ' + p.expired + ' 已过期不可出</span>' : '') : '';
  if (p) $('outQty').focus();
});
$('outBtn').onclick = function () {
  var p = outPicker.value;
  if (!p) return toast('请选择产品 Pick a product', 'err');
  var btn = this; btn.disabled = true;
  call('apiStockOut', { sku: p.sku, qty: $('outQty').value, unit: outUnit.get(), ref: $('outRef').value, note: $('outNote').value })
    .then(function (r) {
      toast('✓ 已出库 ' + p.nameZh + ' ' + r.text, 'ok');
      $('outResult').style.display = 'block';
      $('outResult').innerHTML = '<b>拣货单 Pick list — ' + esc(p.nameZh) + ' ' + esc(r.text) + '</b>' +
        '<table><tr><th class="hide-sm">批次</th><th>批号</th><th>有效期</th><th>仓位</th><th class="num">数量</th></tr>' +
        r.allocations.map(function (a) {
          return '<tr><td class="hide-sm">' + esc(a.batchId) + '</td><td>' + esc(a.lotNo || '-') + '</td><td>' + esc(a.expiry || '-') +
            '</td><td>' + esc(a.location || '-') + '</td><td class="num">' + a.qty + '</td></tr>';
        }).join('') + '</table>';
      ['outQty', 'outNote'].forEach(function (id) { $(id).value = ''; });
      outPicker.pick(null);
      return refresh();
    })
    .catch(function (e) { toast(e.message, 'err'); })
    .then(function () { btn.disabled = false; });
};

// ---------- Stocktake ----------
var countPicker = makePicker('countPicker', function (p) { if (p) loadCountBatches(p); else $('countBatches').innerHTML = ''; });
function loadCountBatches(p) {
  var box = $('countBatches');
  box.className = 'loading'; box.textContent = '加载中 Loading…';
  call('apiBatches', p.sku).then(function (batches) {
    box.className = '';
    if (!batches.length) { box.innerHTML = '<p class="muted">此产品没有库存批次 No stock batches</p>'; return; }
    box.innerHTML = '<table><tr><th>批次 / 有效期</th><th class="num">系统</th><th style="width:30%">实际 Counted</th></tr>' +
      batches.map(function (b) {
        var expired = b.expiry && b.expiry < state.today;
        return '<tr><td>' + esc(b.lotNo || b.batchId) + '<div class="muted">' + esc(b.expiry || '无有效期') +
          (expired ? ' <span class="tag bad">已过期</span>' : '') + ' · ' + esc(b.location || '') + '</div></td>' +
          '<td class="num">' + b.remaining + '</td><td><input type="number" min="0" step="1" inputmode="numeric" data-b="' +
          esc(b.batchId) + '" data-sys="' + b.remaining + '" placeholder="' + b.remaining + '"></td></tr>';
      }).join('') + '</table>' +
      '<label>原因 Reason</label><select id="countReason"><option>盘点 Stocktake</option><option>报废/过期 Write-off expired</option>' +
      '<option>损坏 Damaged</option><option>解冻 Thawed / cold-chain break</option><option>其他 Other</option></select>' +
      '<label>备注 Note</label><input id="countNote"><button class="btn" id="countBtn">保存盘点 Save</button>' +
      '<p class="muted">只填写与系统不同的批次；过期货报废请填 0。</p>';
    $('countBtn').onclick = function () { saveCount(p); };
  }).catch(function (e) { box.className = ''; box.textContent = e.message; });
}
function saveCount(p) {
  var inputs = Array.prototype.filter.call($('countBatches').querySelectorAll('input[data-b]'), function (i) {
    return i.value !== '' && Number(i.value) !== Number(i.dataset.sys);
  });
  if (!inputs.length) return toast('没有改动 Nothing changed', 'err');
  var btn = $('countBtn'); btn.disabled = true;
  var reason = $('countReason').value, note = $('countNote').value, total = 0;
  inputs.reduce(function (chain, i) {
    return chain.then(function () {
      return call('apiAdjust', { batchId: i.dataset.b, counted: i.value, reason: reason, note: note })
        .then(function (r) { total += r.delta; });
    });
  }, Promise.resolve())
    .then(function () { toast('✓ 已调整 ' + inputs.length + ' 个批次，合计 ' + (total > 0 ? '+' : '') + total, 'ok'); })
    .catch(function (e) { toast(e.message, 'err'); })
    .then(function () { return refresh(); })
    .then(function () { loadCountBatches(state.bySku[p.sku] || p); });
}

// ---------- Expiry ----------
function loadExpiry() {
  var box = $('expiryTable');
  call('apiExpiryList').then(function (rows) {
    box.className = '';
    if (!rows.length) { box.innerHTML = '<p class="muted">未来 ' + state.warnDays + ' 天内没有到期批次 👍</p>'; return; }
    box.innerHTML = '<p class="muted">已过期 + 未来 ' + state.warnDays + ' 天内到期的批次（建议优先促销 / 报废）</p>' +
      '<table><tr><th>有效期</th><th>产品</th><th class="hide-sm">批号 / 仓位</th><th class="num">剩余</th></tr>' +
      rows.map(function (b) {
        return '<tr><td>' + (b.expired ? '<span class="tag bad">已过期</span><br>' : '') + esc(b.expiry) + '</td><td><b>' +
          esc(b.nameZh) + '</b><div class="muted">' + esc(b.name) + '</div></td><td class="hide-sm">' + esc(b.lotNo || b.batchId) +
          '<div class="muted">' + esc(b.location) + '</div></td><td class="num">' + esc(b.remainingText) + '</td></tr>';
      }).join('') + '</table>';
  }).catch(function (e) { box.className = ''; box.textContent = e.message; });
}

// ---------- History ----------
var logPicker = makePicker('logPicker', function () { loadLog(); }, true);
function loadLog() {
  var box = $('logTable'), p = logPicker.value;
  box.className = 'loading'; box.textContent = '加载中 Loading…';
  call('apiMovements', p ? p.sku : '', 100).then(function (rows) {
    box.className = '';
    if (!rows.length) { box.innerHTML = '<p class="muted">暂无记录 No movements yet</p>'; return; }
    var label = { IN: '入库', OUT: '出库', ADJUST: '调整' };
    box.innerHTML = '<table><tr><th>时间</th><th>类型</th><th>产品</th><th class="num">数量</th><th class="hide-sm">单据 / 操作人</th></tr>' +
      rows.map(function (m) {
        var prod = state.bySku[m.sku];
        return '<tr><td class="muted">' + esc(m.time) + '</td><td>' + esc(label[m.type] || m.type) + '</td><td>' +
          esc(prod ? prod.nameZh : m.sku) + (m.note ? '<div class="muted">' + esc(m.note) + '</div>' : '') +
          '</td><td class="num">' + esc(m.qty) + '</td><td class="hide-sm">' + esc(m.ref) + '<div class="muted">' + esc(m.user) +
          '</div></td></tr>';
      }).join('') + '</table>';
  }).catch(function (e) { box.className = ''; box.textContent = e.message; });
}

// ---------- Load ----------
function refresh() {
  return call('apiBootstrap').then(function (d) {
    state.summary = d.summary; state.today = d.today; state.warnDays = d.warnDays; state.locations = d.locations;
    state.bySku = {};
    d.summary.forEach(function (p) { state.bySku[p.sku] = p; });
    Object.keys(pickers).forEach(function (k) { pickers[k].refresh(); });
    $('who').textContent = d.user || '';
    var loc = $('inLoc'), cur = loc.value;
    loc.innerHTML = '<option value="">-</option>' + d.locations.map(function (l) { return '<option>' + esc(l) + '</option>'; }).join('');
    loc.value = cur;
    renderDash();
  }).catch(function (e) {
    $('dashTable').className = ''; $('dashTable').textContent = e.message;
  });
}
refresh();
</script>
</body>
</html>
